name: Update F1 Stats & Deploy to Firebase

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
  schedule:
    - cron: '0 16,19,22 * * 0'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install pandas numpy

      - name: Download & Sync Latest F1DB Data
        run: python pipeline/download_f1db.py

      - name: Generate & Export F1 Pills Data
        run: |
          python pipeline/generate_pills.py
          python pipeline/export_web.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: sports-pills

      - name: Commit Updated Data Back to Repo
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          git diff --staged --quiet || (git commit -m "chore(auto): update F1DB data and pills for latest race [skip ci]" && git push origin main)
