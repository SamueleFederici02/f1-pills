name: Update F1 Stats & Deploy to Firebase

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: # Permette di lanciarlo manualmente da GitHub con un click
  schedule:
    # Esegue un check automatico la domenica sera dopo i GP (es. 16:00, 19:00, 22:00 UTC)
    - cron: '0 16,19,22 * * 0'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate & Export F1 Pills Data
        run: |
          python pipeline/generate_pills.py
          python pipeline/export_web.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPORTS_PILLS }}'
          channelId: live
          projectId: sports-pills
